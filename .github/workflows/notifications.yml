name: Notification delivery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ vars.NOTIFICATION_EMAIL_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Process pending operational emails
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure CRON_SECRET before enabling notification delivery."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            -X POST https://flagos.ca/api/cron/notifications
