name: Refresh demo NFL rosters

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: demo-roster-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch and validate current active rosters
        run: node scripts/syncDemoRosters.mjs
      - name: Test roster selection
        run: node --test scripts/syncDemoRosters.test.mjs
      - name: Commit only validated roster changes
        shell: bash
        run: |
          if git diff --quiet -- src/lib/demoRosterSnapshot.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/demoRosterSnapshot.json
          git commit -m "Refresh active NFL demo rosters" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin HEAD:main
