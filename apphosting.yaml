# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 1
  maxInstances: 5
  concurrency: 40
  # cpu: 1
  # memoryMiB: 512

# Environment variables and secrets.
env:
  # Enable only after the sender, webhook, secrets and scheduler have been tested.
  - variable: NOTIFICATION_EMAIL_ENABLED
    value: "false"
    availability:
      - RUNTIME
  - variable: NOTIFICATION_FROM_EMAIL
    value: "FlagOS <notifications@flagos.ca>"
    availability:
      - RUNTIME
  - variable: NOTIFICATION_REPLY_TO
    value: "dextersargent@flagos.ca"
    availability:
      - RUNTIME
  # Override the checked-in local emulator setting for production builds and runtime.
  - variable: NEXT_PUBLIC_USE_FIREBASE_EMULATORS
    value: "false"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyBHTnWJpyjhbLpGQKJ2BqNWkN43EGP88pw"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "flagfootballleaguemachine.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "flagfootballleaguemachine"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "flagfootballleaguemachine.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "204437433125"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:204437433125:web:71dac0f10bd618b4ef88cc"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ADMIN_EMAILS
    value: "dextersargent@flagos.ca"
    availability:
      - BUILD
